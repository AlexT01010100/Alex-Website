name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy halfway; let the newest one queue behind it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate HTML
        run: npx --yes html-validate@11 index.html

      - name: Check local links and assets
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments index.html
          fail: true

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Publish only the site itself, not repo tooling or docs.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html style.css script.js favicon.svg CNAME Alexander-Terry-Resume.pdf img _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
